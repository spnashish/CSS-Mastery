<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      height: 300px;
      border: 2px solid black;
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: coral;
      color: white;
      font-size: 2em;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px;
    }

    .box:nth-child(2) {
      align-self: flex-start; /* Overrides align-items */
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

</body>
</html>
