<!DOCTYPE html>
<html>
<head>
<style>
.container {
  height: 200px;
  border: 2px solid black;
  position: relative; /* Parent for absolute child */
}

.static { position: static; background: lightgray; }
.relative { position: relative; top: 20px; left: 20px; background: lightblue; }
.absolute { position: absolute; top: 10px; right: 10px; background: lightgreen; }
.fixed { position: fixed; bottom: 10px; right: 10px; background: coral; }
.sticky { position: sticky; top: 0; background: yellow; }
</style>
</head>
<body>

<div class="sticky">Sticky Header (sticks when scrolling)</div>

<div class="container">
  <div class="static">Static Box</div>
  <div class="relative">Relative Box</div>
  <div class="absolute">Absolute Box</div>
</div>

<div class="fixed">Fixed Box (bottom-right corner)</div>

<p style="margin-top:1000px;">Scroll down to see sticky & fixed effect</p>
</body>
</html>
